[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taximan"
version = "1.0.0"
description = "Ride hailing data platform on MySQL 8: normalized schema, trigger enforced invariants, analytical SQL, concurrency lab, FastAPI service."
requires-python = ">=3.11"
dependencies = [
    "mysql-connector-python>=9.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic[email]>=2.7",
    "python-dotenv>=1.0",
    "faker>=26.0",
    "numpy>=1.26",
    "bcrypt>=4.1",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "httpx>=0.27", "pytest-timeout>=2.3"]
# Optional Snowflake layer. The connector is imported lazily, the rest are used by the tests.
warehouse = ["snowflake-connector-python>=3.12", "pyarrow>=15", "sqlglot>=25", "duckdb>=1.0"]

[project.scripts]
taximan = "taximan.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "tests/warehouse"]
timeout = 120
