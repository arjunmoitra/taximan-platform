name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: taximan_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: taximan_test
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass
      PYTHONPATH: src:concurrency
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,warehouse]"
      - name: enable local_infile and trigger creation on the service container
        run: |
          python - <<'EOF'
          import mysql.connector
          c = mysql.connector.connect(host="127.0.0.1", port=3306, user="root", password="rootpass")
          cur = c.cursor()
          cur.execute("SET GLOBAL local_infile = 1")
          cur.execute("SET GLOBAL log_bin_trust_function_creators = 1")
          c.close()
          EOF
      - run: pytest -q -p no:warnings
      - name: concurrency lab (must print CORRECT for every fix)
        run: |
          python -m taximan.cli migrate
          python -m taximan.cli seed --scale 0.02 --days 60
          python concurrency/lost_update.py | tee lab.txt
          python concurrency/double_booking.py | tee -a lab.txt
          python concurrency/dispatch.py | tee -a lab.txt
          test "$(grep -c CORRECT lab.txt)" -ge 5
          ! grep -q BUG lab.txt
